[project]
name = "chartpipe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["ytmusicapi>=1.10"]

[project.scripts]
chartpipe = "chartpipe.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chartpipe*"]
